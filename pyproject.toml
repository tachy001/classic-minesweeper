[project]
name = "classic-minesweeper"
version = "0.2.0"
description = "Classic Windows-style Minesweeper desktop game built with PyQt6"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyqt6>=6.11.0",
]

[project.scripts]
classic-minesweeper = "classic_minesweeper.app:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
